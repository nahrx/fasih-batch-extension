mmary { cursor: pointer; color: var(--err); font-weight: 600; }\n.view-errs ul { margin: 4px 0 2px; padding-left: 20px; }\n.view-errs code { font-size: 11px; color: var(--muted); }\n.view-errs small { color: var(--muted); }\n.view-host { flex: 1; min-height: 0; position: relative; overflow: hidden; }\n.view-host > * { height: 100%; }\n.dlg-tall { height: calc(100vh - 48px); }\n.dlg-tall .dlg-body { flex: 1; min-height: 0; grid-template-rows: auto 1fr auto; }\n.sel-list { overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 0; }\n.sel-group { position: sticky; top: -4px; background: var(--head-sec); margin: 6px -8px 2px; padding: 3px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; }\n.sel-item { display: flex; gap: 8px; align-items: baseline; padding: 3px 2px; cursor: pointer; border-radius: 4px; }\n.sel-item:hover { background: var(--head); }\n.sel-item .sel-label { flex: 1; min-width: 0; }\n.sel-item code { font-size: 11px; color: var(--muted); }\n.sel-item small { font-size: 11px; color: var(--muted); min-width: 90px; text-align: right; }\n.sel-n { font-size: 11px; color: var(--accent); }\n.legend .l-new { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }\n.legend .l-rmk { background: var(--rmk); border-color: var(--rmk-line); }\n.legend .l-chg { background: var(--panel); box-shadow: inset 3px 0 0 var(--chg); }\n\n/* ---------- dialog impor FASIH ---------- */\n.dlg-wrap { align-items: flex-start; justify-content: center; }\n.dlg {\n  background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); width: min(760px, 100%);\n  max-height: calc(100vh - 48px); overflow: auto; display: flex; flex-direction: column;\n}\n.dlg-body { padding: 12px 14px 16px; display: grid; gap: 8px; }\n.dlg-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.dlg-count { color: var(--muted); font-size: 12px; }\n.dlg-sum { font-size: 12.5px; }\n.sub-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; min-height: 0; }\n.sub-table { width: 100%; border-collapse: collapse; font-size: 12px; }\n.sub-table th, .sub-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }\n.sub-table th { position: sticky; top: 0; background: var(--head); font-weight: 600; }\n.sub-table td:last-child { white-space: normal; min-width: 260px; }\n.sub-table td.mono { font: 11px ui-monospace, Consolas, monospace; }\n.sub-st { font-weight: 700; }\n.sub-st.st-ok { color: var(--ok); }\n.sub-st.st-dryrun { color: var(--accent); }\n.sub-st.st-gagal { color: var(--err); }\n.sub-st.st-lewati { color: var(--muted); }\n.sub-st.st-proses { color: var(--warn); }\n/* tombol Dry run / LIVE disamakan dengan menu Automation (panel FASIH Batch) */\n.btn.dry { border-color: #1a73e8; color: #1a73e8; background: var(--panel); }\n.btn.live { border-color: #d93025; background: #d93025; color: #fff; }\n.btn.dry:hover:not(:disabled) { background: #e8f0fe; border-color: #1a73e8; }\n.btn.live:hover:not(:disabled) { background: #b3261e; border-color: #b3261e; }\n.tb-submit { display: contents; }\n.tb-submit[hidden] { display: none; }\ntd.c0 .rn-empty { font-weight: 400; color: var(--muted); }\n.dlg-sum .m-err { color: var(--err); }\n.dlg-sum .m-warn { color: var(--warn); }\n.dlg-sum .m-ok { color: var(--ok); }\n.dlg-body code { font-size: 12px; background: var(--head); padding: 0 4px; border-radius: 4px; }\n\n/* ---------- misc ---------- */\n.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 5px 12px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }\n.legend i { display: inline-block; width: 14px; height: 10px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line-strong); }\n.legend .l-open { background: var(--panel); box-shadow: inset 3px 0 0 var(--need); }\n.legend .l-lock { background: var(--lock); }\n.legend .l-skip { background: repeating-linear-gradient(-45deg, var(--skip-a) 0 3px, var(--skip-b) 3px 6px); }\n.legend .l-ro { background: var(--ro); }\n.legend .l-err { background: var(--err-soft); border-color: var(--err); }\n.legend .l-warn { background: var(--warn-soft); border-color: var(--warn); }\n.toast-box { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 80; display: grid; gap: 6px; justify-items: center; pointer-events: none; }\n.toast { background: #1f2933; color: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: min(680px, calc(100vw - 32px)); font-size: 12.5px; }\n.toast.err { background: #b91c1c; }\n.toast.ok { background: #15803d; }\n.loading { position: fixed; inset: 0; z-index: 90; background: rgba(15, 23, 42, .35); display: flex; align-items: center; justify-content: center; }\n.loading div { background: var(--panel); padding: 16px 22px; border-radius: 10px; box-shadow: var(--shadow); }\n@media (max-width: 700px) {\n  .tb-input { width: 150px; }\n  .modal { padding: 0; }\n  .infobar { height: auto; max-height: 96px; }\n}\n.tb-submit:not([hidden]) + .tb-check { margin-left: 10px; } /* Jeda kirim … ms | Jeda muat */\n.dlg-modes { display: grid; gap: 6px; }\n.dlg-mode { display: block; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; cursor: pointer; }\n.dlg-mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }\n.dlg-mode span { display: block; margin: 2px 0 0 22px; font-size: 12px; color: var(--muted); }\n\n/* dropdown pencocokan di bawah judul kolom Roster */\nth select.rno-mode { width: 100%; margin-top: 2px; font: inherit; font-size: 11px; padding: 1px 2px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; }\n\n/* sel yang sedang memuat master lookup (> 1 detik) */\ntd.lk-loading { background: var(--warn-soft) !important; }\ntd .lk-spin { font-size: 11px; color: var(--warn); font-style: italic; animation: lk-pulse 1.2s ease-in-out infinite; }\n@keyframes lk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }\n@media (prefers-reduced-motion: reduce) { td .lk-spin { animation: none; } }\n","js":"/*\n * FASIH Sheet — mode sheet untuk kuesioner FASIH.\n * Dirangkai di browser oleh pemuat (sheet-src/loader.js) ke dalam modul engine dari HTML kuesioner yang\n * diimpor (mis. index.html). `SheetEngine` adalah class engine FASIH dari HTML itu, sehingga enableCondition\n * (skip), variabel, validasi, sourceOption, label variabel, readOnly dan nested dihitung oleh engine asli.\n * Setiap baris sheet = satu instance engine = satu isian kuesioner.\n *\n * Data di sheet read-only. Perubahan dilakukan lewat kolom \"UPDATE DATA\" untuk variabel yang dipilih,\n * dicatat sebagai rencana dan baru dieksekusi (data asli + perubahan) saat Export JSON / View hasil update.\n * `SheetForm` adalah FasihForm (UI form dari HTML kuesioner yang diimpor), dipakai untuk tampilan View.\n */\n((SheetEngine, SheetForm) => {\n  'use strict';\n\n  // ------------------------------------------------------------------ konstanta\n  const T = {\n    SECTION: 1, NESTED: 2, HTML: 3, VAR: 4, CHILD: 5, ACTION: 6, GROUP: 7, YEAR: 10, DATE: 11, DATETIME: 12,\n    TIME: 13, MONTH: 14, WEEK: 15, SINGLECHECK: 16, TOGGLE: 17, RANGE: 18, URL: 19, CURRENCY: 20, LISTTEXT: 21,\n    LISTSELECT: 22, MULTISELECT: 23, MASK: 24, TEXT: 25, RADIO: 26, SELECT: 27, NUMBER: 28, CHECKBOX: 29,\n    TEXTAREA: 30, EMAIL: 31, PHOTO: 32, GPS: 33, CSV: 34, NOW: 35, SIGNATURE: 36, UNIT: 37, DECIMAL: 38, FILE: 39,\n    RATING: 40,\n  };\n  const TYPE_NAME = {\n    2: 'Roster / nested', 4: 'Variabel', 6: 'Tombol aksi', 10: 'Tahun', 11: 'Tanggal', 12: 'Tanggal & waktu', 13: 'Jam',\n    14: 'Bulan', 15: 'Minggu', 16: 'Centang tunggal', 17: 'Toggle', 18: 'Slider', 19: 'URL', 20: 'Mata uang',\n    21: 'Daftar teks', 22: 'Daftar pilihan', 23: 'Multi pilihan', 24: 'Teks bermask', 25: 'Teks', 26: 'Pilihan (radio)',\n    27: 'Pilihan (select)', 28: 'Angka', 29: 'Checkbox', 30: 'Teks panjang', 31: 'Email', 32: 'Foto', 33: 'GPS',\n    34: 'CSV', 35: 'Waktu sekarang', 36: 'Tanda tangan', 37: 'Satuan', 38: 'Desimal', 39: 'File', 40: 'Rating',\n  };\n  const UNSUPPORTED = new Set([T.PHOTO, T.CSV, T.SIGNATURE, T.FILE, T.LISTSELECT, T.UNIT]);\n  // foto / tanda tangan / file: nilainya tidak bisa diubah di sheet (media diunggah aplikasi FASIH), tetapi variabelnya\n  // bisa dipilih untuk ditandai \"Abaikan\" per baris -> galat pada variabel itu tidak menahan kirim / export\n  const MEDIA = new Set([T.PHOTO, T.SIGNATURE, T.FILE]);\n  const TEXTLIKE = new Set([T.TEXT, T.TEXTAREA, T.EMAIL, T.URL, T.MASK]);\n  const NUMERIC = new Set([T.NUMBER, T.CURRENCY, T.DECIMAL, T.RANGE]);\n  const OPTION_SINGLE = new Set([T.RADIO, T.SELECT, T.RATING]);\n  const OPTION_MULTI = new Set([T.CHECKBOX, T.MULTISELECT]);\n  const BOOL_TYPES = new Set([T.SINGLECHECK, T.TOGGLE]);\n  const DATE_INPUT = { [T.YEAR]: 'number', [T.DATE]: 'date', [T.DATETIME]: 'datetime-local', [T.TIME]: 'time', [T.MONTH]: 'month', [T.WEEK]: 'week' };\n  const VS_WARNING = 1;\n  const VS_INVALID = 2;\n  const LOOKUP_URL = 'http://localhost:3310/lookup';   // server lookup lokal — hanya untuk sheet di luar halaman FASIH\n\n  // ------------------------------------------------------------------ util\n  const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[ch]));\n  const parser = new DOMParser();\n  const textCache = new Map();\n  // DOMParser tidak memuat gambar/skrip, aman untuk label HTML dari template\n  function htmlToText(s) {\n    if (s === null || s === undefined) return '';\n    s = String(s);\n    if (!/[<&]/.test(s)) return s.replace(/\\s+/g, ' ').trim();\n    let v = textCache.get(s);\n    if (v === undefined) {\n      const doc = parser.parseFromString(s.replace(/<(style|script)[\\s\\S]*?<\\/\\1>/gi, ' ').replace(/<br\\s*\\/?>/gi, ' '), 'tex  (const c of list || []) {\n          if (Array.isArray(c)) walk(c);\n          else if (c && c.dataKey) { if (c.type !== T.NESTED) { all.push({ key: c.dataKey, label: c.label }); if (c.components) walk(c.components); } }\n        }\n      })(nest.tpl?.components);\n      for (const c of nest.cols || []) if (c.type !== T.NESTED && !all.some((x) => x.key === c.key)) all.push({ key: c.key, label: c.label });\n      const c = all.find((x) => /^no_?urut/i.test(x.key)) || all.find((x) => /\\b(nomor|no\\.?)\\s*urut\\b/i.test(htmlToText(x.label || '')));\n      URUT_COL.set(nest.key, c ? c.key : null);\n    }\n    return URUT_COL.get(nest.key);\n  }\n  const rnoFormat = (depth, mode = rnoMode()) => (mode === 'label'\n    ? (depth > 1 ? `format ${Array(depth).fill('nama').join(' › ')}` : 'isi nama / nilai item roster')\n    : (depth > 1 ? `format ${Array(depth).fill('n').join('.')}` : 'harus angka'));\n  /** Item roster satu tingkat beserta nomor urutnya: [{ no, suffix, item }], parent = suffix item induk ('' = tingkat 1). */\n  function rosterLevel(engine, nest, parent) {\n    const uk = urutColOf(nest);\n    return nestedChildren(engine, nest.key + parent).map((item, i) => {\n      const suffix = suffixOf(item.dataKey);\n      const v = uk ? engine.getComponent(uk + suffix)?.answer : undefined;\n      const n = Number(Array.isArray(v) ? v[0]?.value : v);\n      return { no: uk && Number.isInteger(n) && n > 0 ? n : i + 1, suffix, item };\n    });\n  }\n  /** Teks Roster dirapikan: \"2\" / \"1.3\" (nomor urut), \"SITI AMIDA\" / \"A › B\" (nama), atau \"#101\" (key langsung). null bila format salah. */\n  function rnoNormalize(text, depth, mode = rnoMode()) {\n    const raw = String(text ?? '').trim();\n    if (raw.startsWith('#')) {\n      const parts = raw.slice(1).split('#');\n      if (parts.length !== depth || parts.some((p) => !/^\\d+$/.test(p))) return null;\n      return parts.map((p) => `#${Number(p)}`).join('');\n    }\n    if (mode === 'label') {\n      const parts = raw.split(LABEL_SEP).map(cleanLabel1);\n      if (parts.length !== depth || parts.some((p) => !p)) return null;\n      return parts.join(' › ');\n    }\n    const parts = raw.split(/[.\\s/]+/).filter(Boolean);\n    if (parts.length !== depth || parts.some((p) => !/^\\d+$/.test(p))) return null;\n    return parts.map(Number).join('.');\n  }\n  /** Teks Roster -> { suffix: key asli (\"#101\"), item } atau { error }. mode: 'no' (nomor urut) / 'label' (nama item). */\n  function resolveRoster(engine, ros, text, mode = rnoMode()) {\n    const depth = ros.path.length;\n    const norm = rnoNormalize(text, depth, mode);\n    if (!norm) return { error: `Roster \"${String(text ?? '').trim()}\" tidak valid (${rnoFormat(depth, mode)}, atau key langsung mis. #101)` };\n    if (!engine) return { error: 'data assignment belum dimuat' };\n    if (norm.startsWith('#')) {\n      const item = rosterItem(engine, ros, norm);\n      return item ? { suffix: norm, item } : { error: `item roster key ${norm} tidak ada` };\n    }\n    let parent = '';\n    let item = null;\n    const parts = mode === 'label' ? norm.split(' › ') : norm.split('.').map(Number);\n    for (let i = 0; i < depth; i++) {\n      const nest = ros.path[i];\n      const what = mode === 'label' ? `\"${parts[i]}\"` : `No ${parts[i]}`;\n      const hits = rosterLevel(engine, nest, parent).filter((x) => (mode === 'label' ? normLabel(x.item.label) === normLabel(parts[i]) : x.no === parts[i]));\n      if (!hits.length) return { error: `${htmlToText(nest.label) || nest.key} ${what} tidak ada` };\n      if (hits.length > 1) return { error: `${what} ganda di ${htmlToText(nest.label) || nest.key} (key ${hits.map((h) => h.suffix).join(', ')}) — isi key langsung, mis. ${hits[0].suffix}` };\n      parent = hits[0].suffix;\n      item = hits[0].item;\n    }\n    return { suffix: parent, item };\n  }\n  /** Suffix key asli -> teks Roster pada mode tertentu (nomor urut \"1.3\" / nama \"A › B\"); null bila item tidak ada. */\n  function rnoTextOf(engine, ros, suffix, mode) {\n    const segs = suffix.match(/#\\d+/g) || [];\n    if (segs.length !== ros.path.length) return null;\n    const parts = [];\n    let parent = '';\n    for (let i = 0; i < segs.length; i++) {\n      const it = rosterLevel(engine, ros.path[i], parent).find((x) => x.suffix === parent + segs[i]);\n      if (!it) return null;\n      parts.push(mode === 'label' ? cleanLabel1(it.item.label) : String(it.no));\n      parent += segs[i];\n    }\n    return parts.join(mode === 'label' ? ' › ' : '.');\n  }\n  /** Ganti pencocokan kolom Roster; isi yang sudah ada diubah ke mode baru supaya tetap menunjuk item yang sama. */\n  function setRnoMatch(mode) {\n    mode = mode === 'label' ? 'label' : 'no';\n    const from = rnoMode();\n    if (mode === from) return;\n    const ros = selRoster();\n    let conv = 0;\n    let keep = 0;\n    if (ros) {\n      for (const row of state.rows) {\n        if (!row.rosterNo || row.rosterNo.startsWith('#')) continue;\n        const res = resolveRoster(row.engine, ros, row.rosterNo, from);\n        let t = res.suffix ? rnoTextOf(row.engine, ros, res.suffix, mode) : null;\n        // nama kembar di roster yang sama: pakai key langsung supaya tetap menunjuk item yang sama\n        if (t && resolveRoster(row.engine, ros, t, mode).suffix !== res.suffix) t = res.suffix;\n        if (t) { row.rosterNo = t; conv++; } else keep++;\n      }\n    }\n    state.rnoMatch = mode;\n    for (const g of grids) g.build(); // judul kolom (dropdown) + isi\n    scheduleSave();\n    updateInfo();\n    toast(`Roster dicocokkan berdasarkan ${RNO_MODE_TEXT[mode].toLowerCase()}.${conv ? ` ${conv} isian diubah ke ${RNO_MODE_TEXT[mode].toLowerCase()}.` : ''}${keep ? ` ${keep} isian tidak dikenali, dibiarkan (ditandai error).` : ''}`, 'ok');\n  }\n  /** Item roster (komponen anak) untuk suffix ini; null bila tidak ada / tidak aktif. */\n  function rosterItem(engine, ros, suffix) {\n    const parent = suffix.slice(0, suffix.lastIndex t lvl = ros.path.length === 1 || parent ? ros.path.length - 1 : 0;\n    const kids = rd?.engine ? rosterLevel(rd.engine, ros.path[lvl], lvl ? parent : '') : [];\n    const list = kids.slice(0, 15).map((k) => `${k.no} · ${htmlToText(k.item.label) || k.item.dataKey} (${k.suffix})`).join(' | ');\n    const uk = urutColOf(ros.path[lvl]);\n    const msgs = [];\n    if (st?.error) msgs.push(`<span class=\"m-err\">⚠ ${esc(st.error)}<\/span>`);\n    if (st?.warn) msgs.push(`<span class=\"m-warn\">⚠ ${esc(st.warn)}<\/span>`);\n    const how = rnoMode() === 'label'\n      ? `nama / nilai item roster \"${esc(ros.nest.label)}\" (label item, tanpa beda huruf besar/kecil)${ros.path.length > 1 ? ` · bertingkat: ${ros.path.map(() => 'nama').join(' › ')}` : ''}`\n      : `nomor urut item roster \"${esc(ros.nest.label)}\"${ros.path.length > 1 ? ` (roster bertingkat: ${ros.path.map(() => 'n').join('.')})` : ''} · nomor urut dari ${uk ? `<code>${esc(uk)}<\/code>` : 'posisi item'}, bukan key \"#\"`;\n    msgs.push(`<span class=\"m-info\">Item roster yang variabelnya diubah di baris ini, dicocokkan berdasarkan ${how} · ganti cara pencocokan lewat dropdown di bawah judul kolom Roster · key langsung: awali dengan # (mis. #101) · ketik lalu Enter · satu assignment boleh di beberapa baris dengan Roster berbeda<\/span>`);\n    if (kids.length) msgs.push(`<span class=\"m-info\">Item (No · nama (key)): ${esc(list)}${kids.length > 15 ? ` | … (${kids.length} item)` : ''}<\/span>`);\n    return `<div class=\"ib-loc\"><span>${esc(rd ? `Baris ${r + 1}${rd.row?.meta?.code ? ` · ${rd.row.meta.code}` : ''}` : 'Baris baru')}<\/span><b>ROSTER · ${esc(RNO_MODE_TEXT[rnoMode()].toUpperCase())}<\/b><code>${esc(ros.nest.key)}<\/code><\/div>`\n      + `<div class=\"ib-label\">${esc(st?.item ? htmlToText(st.item.label) : ros.nest.label)}<\/div><div class=\"ib-msg\">${msgs.join('')}<\/div>`;\n  }\n  /** Ubah No roster baris; perubahan & remark baris itu ikut pindah ke item roster yang baru.\n      No roster yang formatnya benar tetapi itemnya tidak ada (atau ganda) TETAP disimpan, sel ditandai error\n      (rnoState) -> { ok, warn }. Hanya format yang salah yang ditolak. */\n  function setRosterNo(row, text, ros) {\n    const raw = String(text ?? '').trim();\n    const depth = ros.path.length;\n    const norm = raw ? rnoNormalize(raw, depth) : '';\n    const res = raw ? resolveRoster(row.engine, ros, raw) : null;\n    if (raw && !norm) return { error: res.error };\n    const warn = res?.error || null;\n    const suf = res && !warn ? res.suffix : null;\n    // suffix lama: dari No roster tersimpan; bila tidak bisa di-resolve (mis. sheet lama yang menyimpan key\n    // sebagai nomor), dari kunci perubahan/remark baris ini supaya perubahannya tetap ikut pindah\n    const oldRes = row.rosterNo ? resolveRoster(row.engine, ros, row.rosterNo) : null;\n    const inferOld = () => {\n      for (const k of [...row.updates.keys(), ...row.remarks.keys()]) {\n        const i = k.indexOf('#');\n        if (i > 0 && ROSTER_OF.get(k.slice(0, i))?.length === depth) return k.slice(i);\n      }\n      return null;\n    };\n    const old = oldRes && !oldRes.error ? oldRes.suffix : inferOld();\n    if (old === suf && (row.rosterNo || '') === norm) return { same: true };\n    if (old && old !== suf) {\n      const inRoster = (k) => k.endsWith(old) && ROSTER_OF.get(k.slice(0, -old.length))?.length === depth;\n      const moving = [...row.updates.keys(), ...row.remarks.keys()].filter(inRoster);\n      // item baru tidak ada: perubahan tidak bisa dipindah (dan tidak boleh tertinggal di item lama lalu ikut terkirim)\n      if (!suf && moving.length && !window.confirm(`${raw ? `Roster ${raw}: ${warn}.` : 'Roster dikosongkan:'} ${moving.length} perubahan/remark di baris ini dibuang. Lanjutkan?`)) return { cancel: true };\n      for (const map of [row.updates, row.remarks]) {\n        for (const [k, v] of [...map]) {\n          if (!inRoster(k)) continue;\n          map.delete(k);\n          if (suf) map.set(k.slice(0, -old.length) + suf, v);\n        }\n      }\n    }\n    row.rosterNo = norm;\n    row.updVer = (row.updVer || 0) + 1;\n    return { ok: true, warn };\n  }\n  function commitRno(grid, r, text, move) {\n    const rd = grid.rowDescs[r];\n    if (!rd?.row || !grid.roster) return;\n    const res = setRosterNo(rd.row, text, grid.roster);\n    if (res.error) { toast(res.error, 'err'); return; }\n    if (res.warn) toast(`Roster ${String(text).trim()} tetap diisi, tetapi ${res.warn} — perbaiki sebelum kirim.`, 'err');\n    if (!res.same && !res.cancel) {\n      setLoading('Memeriksa perubahan…');\n      try { for (const g of grids) g.renderBody(); } finally { setLoading(null); }\n      scheduleSave();\n    }\n    moveAfter(grid, r, grid.cols.findIndex((x) => x.kind === 'rno'), move);\n    updateInfo();\n  }\n  function rnoEditor(grid, r, initial) {\n    closeEditor();\n    const c = grid.cols.findIndex((x) => x.kind === 'rno');\n    const td = grid.cellEl(r, c);\n    const st = grid.state(r, c);\n    if (!td || !st) return;\n    if (!grid.rowDescs[r]?.row?.source) return toast('Isi assignment_id dulu; Roster dipilih dari item roster assignment itu.');\n    grid.scrollToCell(td);\n    const el = document.createElement('input');\n    el.className = 'ed-input';\n    el.type = 'text';\n    el.spellcheck = false;\n    el.placeholder = rnoMode() === 'label'\n      ? (grid.roster.path.length > 1 ? `Nama item (${grid.roster.path.map(() => 'nama').join(' › ')})` : 'Nama / nilai item roster')\n      : (grid.roster.path.length > 1 ? `No urut (${grid.roster.path.map(() => 'n').join('.')})` : 'No urut (angka)');\n    el.value = initial !== undefined ? initial : (st.rno || '');\n    const rect = td.getBoundingClientRect();\n    placeOverCell(el, rect);\n    document.body.appendChild(el);\n    el.focus();\n    if (initial === undefined) el.select();\n    const finish = (move) => {\n      if (!editor || editor.el !== el) return;\n      const v = el.value.trim();\n      clo de ? ` · ${m.code}` : ''}${m?.label ? ` · ${m.label}` : ''}`;\n    let msg = isNew\n      ? 'Ketik / tempel assignment_id lalu Enter: data dimuat dari FASIH (get-by-assignment-id). Tempel banyak ID sekaligus untuk menambah banyak baris.'\n      : 'Enter untuk mengganti / memuat ulang assignment pada baris ini dari FASIH.';\n    let cls = 'm-info';\n    if (st?.loading) msg = 'Memuat data dari FASIH…';\n    else if (st?.loadError) { msg = `Gagal memuat: ${st.loadError} — Enter untuk mencoba lagi.`; cls = 'm-err'; }\n    return `<div class=\"ib-loc\"><span>${esc(head)}<\/span><b>ASSIGNMENT ID<\/b><code>assignment_id<\/code><\/div>`\n      + `<div class=\"ib-label\">${esc(st?.aid || 'assignment_id')}<\/div><div class=\"ib-msg\"><span class=\"${cls}\">${esc(msg)}<\/span><\/div>`;\n  }\n\n  // ------------------------------------------------------------------ kolom UPDATE DATA\n  const UPD_SECTION = { key: '__update', label: 'UPDATE DATA — variabel yang dipilih' };\n  const canon = (v) => JSON.stringify(v ?? null, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort()) : x));\n  /** Kolom tambahan (Lama + Baru + Remark) untuk setiap variabel terpilih; Lama & Remark mengikuti toggle di toolbar. */\n  function buildUpdCols(baseCols, selected) {\n    const out = [];\n    baseCols.forEach((col, baseIndex) => {\n      if (!selected.has(col.key) || MEDIA.has(col.type)) return; // foto/ttd/file -> kolom \"Abaikan\" (buildIgnCols)\n      const common = { key: col.key, type: col.type, tpl: col.tpl, target: col, baseIndex, sections: [UPD_SECTION] };\n      if (state.showOld) out.push({ ...common, kind: 'old', label: `Lama · ${col.label}`, width: Math.max(110, Math.min(col.width, 170)) });\n      out.push({ ...common, kind: 'new', label: `Baru · ${col.label}`, width: Math.max(130, col.width) });\n      // kolom remark hanya untuk variabel yang mengizinkan remark (enableRemark di template)\n      if (state.showRemark && col.tpl?.enab  const params = req.params.map((p) => ({ key: p.key, values: paramValues(p.value) }));\n    if (params.some((p) => !p.values.length)) return { options: [], lookup: true, missing: true };\n    if (onFasih()) {\n      // halaman FASIH: master dari API lookup FASIH (login sama), disaring menurut pertanyaan induk (parentCondition)\n      try {\n        const rows = await fasihLookupFiltered(req.config, params);\n        const options = rows.map((row) => toLookupOption(row, req.config)).filter(Boolean);\n        const truncated = rows.truncated || null;\n        return { options, truncated, lookup: true, failed: !options.length, empty: !options.length, source: 'API lookup FASIH', error: options.length ? null : `tidak ada baris master${params.length ? ` untuk ${params.map((x) => `${x.key} = ${x.values.join(' / ')}`).join(', ')}` : ''}` };\n      } catch (e) {\n        return { options: [], lookup: true, failed: true, source: 'API lookup FASIH', error: String((e && e.message) || e) };\n      }\n    }\n    try {\n      const url = new URL(LOOKUP_URL);\n      url.searchParams.append('id', req.config.id);\n      url.searchParams.append('v', req.config.version);\n      url.searchParams.append('c', JSON.stringify(req.params));\n      const res = await fetch(url.toString());\n      const json = await res.json();\n      let data = json.data;\n      if (typeof data === 'string') data = JSON.parse(data);\n      const options = (data || []).map((row) => ({ label: row[req.config.desc], value: row[req.config.value], description: row[req.config.fullDesc] }));\n      return { options, lookup: true, failed: !options.length, source: LOOKUP_URL };\n    } catch (e) {\n      return { options: [], lookup: true, failed: true, source: LOOKUP_URL, error: String((e && e.message) || e) };\n    }\n  }\n  /** Baris master -> opsi { value (string), label, description }; null bila kolom nilai kosong. */\n  function toLookupOption(row, config) {\n    const value = col(row, config.value);\n    if (value === undefined || value === null || String(value).trim() === '') return null;\n    const label = col(row, config.desc);\n    const description = col(row, config.fullDesc);\n    return { label: label === undefined || label === null || label === '' ? String(value) : String(label), value: String(value),\n             ...(description !== undefined && description !== null ? { description: String(description) } : {}) };\n  }\n  /** Nilai induk lookup -> daftar kode (string). [{value:'6472',label:'…'}] -> ['6472']; '' / [] -> []. */\n  function paramValues(v) {\n    const list = Array.isArray(v) ? v : [v];\n    return list.map((x) => (x && typeof x === 'object' ? x.value : x))\n      .filter((x) => x !== undefined && x !== null && String(x).trim() !== '')\n      .map((x) => String(x).trim());\n  }\n  /** Baris master memenuhi semua syarat induk (kolom = salah satu kode induk). */\n  const sameCode = (a, b) => a === b || (/^\\d+$/.test(a) && /^\\d+$/.test(b) && Number(a) === Number(b)); // '01' = '1'\n  const matchParams = (row, params) => params.every((p) => { const v = String(col(row, p.key) ?? '').trim(); return p.values.some((x) => sameCode(x, v)); });\n  /**\n   * Baris master yang cocok dengan induk. Lookup berinduk (mis. desa per kecamatan) dicoba disaring di server dulu\n   * supaya tabel besar tidak dimuat seluruhnya; bila server tidak menyaring / format filter tidak dikenali, seluruh\n   * koleksi dimuat sekali lalu disaring di browser. Hasil per induk di-cache.\n   */\n  const lookupFilterCache = new Map();\n  async function fasihLookupFiltered(config, params) {\n    if (!params.length) return fasihLookupRows(config);\n    const key = `${config.id}@${config.version ?? ''}?${JSON.stringify(params)}`;\n    if (!lookupFilterCache.has(key)) {\n      const p = (async () => {\n        // koleksi lengkap belum ada di memori & tiap induk satu nilai -> minta server menyaring\n        if (!lookupCache.has(`${config.id}@${config.version ?? ''}`) && params.every((x) => x.values.length === 1)) {\n          const one = params.map((x) => ({ key: x.key, value: x.values[0] }));\n          for (const body of [JSON.stringify(one), JSON.stringify(Object.fromEntries(one.map((x) => [x.key, x.value])))]) {\n            try {\n              const got = await fasihLookupFetch(config, [{ method: 'POST', body }]);\n              // server mengabaikan filter (ada baris induk lain) -> hasilnya bisa sebagian saja: jangan dipakai\n              if (got.length && !got.truncated && got.every((row) => matchParams(row, params))) return got;\n            } catch (e) { /* coba cara berikutnya */ }\n          }\n        }\n        const all = await fasihLookupRows(config);\n        const rows = all.filter((row) => matchParams(row, params));\n        if (all.truncated) rows.truncated = all.truncated;\n        return rows;\n      })();\n      lookupFilterCache.set(key, p);\n      p.catch(() => lookupFilterCache.delete(key));\n    }\n    return lookupFilterCache.get(key);\n  }\n  const LOOKUP_LOADING_MS = 1000;\n  /** Tanda \"memuat lookup…\" di sel bila pemuatan opsi (master lookup) lebih dari 1 detik; hilang begitu selesai. */\n  async function withCellLoading(grid, r, c, work) {\n    let td = null;\n    let prev = '';\n    const timer = setTimeout(() => {\n      td = grid.cellEl(r, c);\n      if (!td) return;\n      prev = td.innerHTML;                                   // isi sel diganti sementara supaya tanda tidak terpotong\n      td.classList.add('lk-loading');\n      td.innerHTML = '<span class=\"lk-spin\" title=\"Mengambil pilihan dari master lookup FASIH\">⏳ memuat lookup…<\/span>';\n    }, LOOKUP_LOADING_MS);\n    try {\n      return await work();\n    } finally {\n      clearTimeout(timer);\n      // sel belum digambar ulang (masih berisi tanda): kembalikan isinya\n      if (td && td.querySelector('.lk-spin')) { td.classList.remove('lk-loading'); td.innerHTML = prev; }\n    }\n  }\n  /** Sheet berjalan di halaman FASIH (menu Custom automation / engine script): API FASIH memakai login yang sama. */\n  function onFasih() {\n    try { if (customApi()) return true; } catch (e) { /* abaikan */ }\n    try { return window.origin === FASIH_ORIGIN || location.origin === FASIH_ORIGIN; } catch (e) { return false; }\n  }\n  /** Nilai kolom tabel master tanpa beda huruf besar/kecil nama kolom (Kode / kode). */\n  function col(row, name) {\n    if (!row || name == null) return undefined;\n    if (name in row) return row[name];\n    const k = Object.keys(row).find((x) => x.toLowerCase() === String(name).toLowerCase());\n    return k === undefined ? undefined : row[k];\n  }\n  /** Cari array baris tabel di respons lookup (bentuknya bisa data, data.data, content, atau {columns, rows}). */\n  function lookupRowsOf(x, valueCol, d = 0) {\n    if (!x || typeof x !== 'object' || d > 6) return null;\n    if (typeof x === 'string') return null;\n    if (Array.isArray(x)) {\n      if (x.length && x.every((o) => o && typeof o === 'object' && !Array.isArray(o)) && x.some((o) => col(o, valueCol) !== undefined)) return x;\n      for (const v of x.slice(0, 5)) { const r = lookupRowsOf(v, valueCol, d + 1); if (r) return r; }\n      return null;\n    }\n    const names = x.columns || x.headers || x.header || x.fields;\n    const vals = x.rows || x.data || x.values;\n    if (Array.isArray(names) && Array.isArray(vals) && Array.isArray(vals[0])) {\n      const keys = names.map((c) => (typeof c === 'string' ? c : c.name || c.key || c.field || c.column));\n      return vals.map((r) => Object.fromEntries(keys.map((n, i) => [n, r[i]])));\n    }\n    for (const v of Object.values(x)) {\n      const r = lookupRowsOf(typeof v === 'string' && /^[[{]/.test(v.trim()) ? (() => { try { return JSON.parse(v); } catch (e) { return null; } })() : v, valueCol, d + 1);\n      if (r) return r;\n    }\n    return null;\n  }\n  /** Jumlah total baris yang dilaporkan respons (paginasi), mis. totalElements / total / recordsTotal; 0 bila tidak ada. */\n  function lookupTotalOf(x, d = 0) {\n    if (!x || typeof x !== 'object' || Array.isArray(x) || d > 3) return 0;\n    for (const k of ['totalElements', 'totalElement', 'totalCount', 'totalData', 'totalRows', 'recordsTotal', 'total']) {\n      const v = Number(x[k]);\n      if (Number.isFinite(v) && v > 0) return v;\n    }\n    for (const v of Object.values(x)) { const t = lookupTotalOf(v, d + 1); if (t) return t; }\n    return 0;\n  }\n  const lookupCache = new Map(); // `${id}@${version}` -> Promise<baris master>\n  /** Seluruh baris satu koleksi master dari API lookup FASIH — dimuat sekali per koleksi (sama seperti script BANR usaha). */\n  function fasihLookupRows(config) {\n    const key = `${config.id}@${config.version ?? ''}`;\n    if (!lookupCache.has(key)) {\n      const p = fasihLookupFetch(config, [{ method: 'POST', body: '{}' }, { method: 'POST', body: '[]' }, { method: 'GET' }]);\n      lookupCache.set(key, p);\n      p.catch(() => lookupCache.delete(key)); // gagal -> boleh dicoba lagi\n    }\n    return lookupCache.get(key);\n  }\n  /** Satu permintaan ke API lookup FASIH (beberapa cara panggil dicoba berurutan) -> baris master. */\n  async function fasihLookupFetch(config, ways) {\n    const url = `${FASIH_ORIGIN}/app/api/lookup/api/v1/collections/${encodeURIComponent(config.id)}/filter?version=${encodeURIComponent(config.version ?? '')}`;\n    const xsrf = decodeURIComponent((document.cookie.match(/(?:^|;\\s*)XSRF-TOKEN=([^;]+)/) || [])[1] || '');\n    const headers = { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': xsrf };\n    const notes = [];\n    for (const c of ways) {\n      const name = `${c.method}${c.body ? ` ${c.body}` : ''}`;\n      try {\n        const r = await fetch(url, { method: c.method, credentials: 'include', headers, ...(c.body ? { body: c.body } : {}) });\n        const text = await r.text();\n        if (!r.ok) { notes.push(`${name} → HTTP ${r.status}`); continue; }\n        let j;\n        try { j = JSON.parse(text); } catch (e) { notes.push(`${name} → bukan JSON`); continue; }\n        const rows = lookupRowsOf(j, config.value);\n        if (rows && rows.length) {\n          const total = lookupTotalOf(j);\n          if (total > rows.length) {\n            rows.truncated = { got: rows.length, total };\n            console.warn(`[FASIH Sheet] lookup ${config.tableName || config.id}: respons hanya ${rows.length} dari ${total} baris (terpotong)`);\n          }\n          return rows;\n        }\n        notes.push(`${name} → tidak ada baris berkolom ${config.value}`);\n      } catch (e) { notes.push(`${name} → ${String((e && e.message) || e)}`); }\n    }\n    throw new Error(notes.join(' | '));\n  }\n\n  async function optionEditor(grid, r, c, st, td, initial) {\n    const multi = OPTION_MULTI.has(st.col.type);\n    const el = document.createElement('div');\n    el.className = 'pop';\n    el.innerHTML = `<input class=\"pop-q\" placeholder=\"Ketik kode atau cari label…\"><div class=\"pop-list\"><div class=\"pop-note\">Memuat pilihan…<\/div><\/div>`\n      + `<div class=\"pop-foot\">${multi ? 'Spasi/klik: centang · Enter: simpan' : 'Enter/klik: pilih'} · Esc: batal${multi ? ' <button class=\"btn\" data-act=\"save\">Simpan<\/button>' : ''}${st.answered ? ' <button class=\"btn\" data-act=\"clear\">Kosongkan<\/button>' : ''}<\/div>`;\n    placeBelow(el, td.getBoundingClientRect(), 280);\n    editor = { el, grid };\n    const q = el.querySelector('.pop-q');\n    const list = el.querySelector('.pop-list');\n    q.value = initial || '';\n    q.focus();\n\n    const { options, lookup, failed, missing, empty, truncated, source, error: lookupError } = await withCellLoading(grid, r, c, () => loadOptions(grid, r, st));\n    if (!editor || editor.el !== el) return;\n    const selected = new Map((Array.isArray(st.comp.answer) ? st.comp.answer : []).map((o) => [String(o?.value), o]));\n    let filtered = [];\n    let hl = 0;\n    let openOpt = null;\n\n    const choose = (opt) => {\n      if (opt.open) {\n        openOpt = opt;\n        list.innerHTML = `<div class=\"pop-body\"><label>Sebutkan (${esc(optLabel(opt))})<input class=\"open-text\" value=\"${esc(selected.get(String(opt.value))?.label ?? '')}\"><\/label><\/div>`;\n        const inp = list.querySelector('.open-text');\n        inp.focus();\n        inp.addEventListener('keydown', (e) => {\n          e.stopPropagation();\n          if (e.key === 'Enter') {\n            e.preventDefault();\n            const text = cleanText(inp.value);\n            if (!text) { toast('Keterangan \"lainnya\" wajib diisi.', 'err'); return; }\n            const ans = { ...opt, label: text };\n            if (multi) { selected.set(String(opt.value), ans); openOpt = null; render(); q.focus(); }\n            else { closeEditor(); commit(grid, r, c, [ans], 'down'); }\n          } else if (e.key === 'Escape') { e.preventDefault(); openOpt = null; render(); q.focus(); }\n        });\n        return;\n      }\n      if (!multi) { closeEditor(); commit(grid, r, c, [{ ...opt }], 'down'); return; }\n      const k = String(opt.value);\n      if (selected.has(k)) selected.delete(k);\n      else selected.set(k, { ...opt, value: opt.value, label: opt.label });\n      render();\n    };\n    const saveMulti = () => {\n      const ans = options.filter((o) => selected.has(String(o.value))).map((o) => selected.get(String(o.value)));\n      closeEditor();\n      commit(grid, r, c, ans.length ? ans : [], 'down');\n    };\n    const manual = () => {\n      const code = q.value.trim();\n      if (!code) return;\n      closeEditor();\n      commit(grid, r, c, [{ value: code, label: code }], 'down');\n    };\n    function render() {\n      if (openOpt) return;\n      const term = q.value.trim().toLowerCase();\n      filtered = options.filter((o) => !term || String(o.value).toLowerCase() === term || optLabel(o).toLowerCase().includes(term) || String(o.value).toLowerCase().startsWith(term));\n      const exact = filtered.findIndex((o) => String(o.value).toLowerCase() === term);\n      if (exact > 0) filtered.unshift(filtered.splice(exact, 1)[0]);\n      hl = Math.min(hl, Math.max(0, filtered.length - 1));\n      if (!options.length) {\n        const why = missing ? 'Isi dulu pertanyaan induk (parent) untuk lookup ini.' : lookup && empty ? `Tidak ada pilihan di master (${lookupError || source}).`\n          : lookup ? `Lookup master tidak tersedia (${source || 'lookup'}${lookupError ? `: ${lookupError}` : ''}). Ketik kode lalu Enter untuk isi manual.` : 'Tidak ada pilihan pada kondisi ini.';\n        list.innerHTML = `<div class=\"pop-note\">${esc(why)}<\/div>`;\n        return;\n      }\n      const cut = truncated ? `<div class=\"pop-note\">⚠ Master hanya termuat ${truncated.got} dari ${truncated.total} baris — pilihan bisa tidak lengkap.<\/div>` : '';\n      if (!filtered.length) { list.innerHTML = `${cut}<div class=\"pop-note\">Tidak ada yang cocok.<\/div>`; return; }\n      list.innerHTML = cut + filtered.slice(0, 400).map((o, i) => {\n        const sel = selected.has(String(o.value));\n        return `<div class=\"pop-item${i === hl ? ' hl' : ''}${sel ? ' sel' : ''}\" data-i=\"${i}\">${multi ? `<input type=\"checkbox\"${sel ? ' checked' : ''} tabindex=\"-1\">` : ''}`\n          + `<span class=\"pv\">${esc(o.value)}<\/span><span>${esc(optLabel(o))}${o.open ? ' <i>(sebutkan)<\/i>' : ''}<\/span><\/div>`;\n      }).join('');\n      list.querySelector('.hl')?.scrollIntoView({ block: 'nearest' });\n    }\n    render();\n    if (failed && lookup && initial) q.select();\n    q.addEventListener('input', () => { hl = 0; render(); });\n    list.addEventListener('mousedown', (e) => e.preventDefault());\n    list.addEventListener('click', (e) => {\n      const it = e.target.closest('.pop-item');\n      if (it) choose(filtered[+it.dataset.i]);\n    });\n    el.querySelector('[data-act=\"save\"]')?.addEventListener('click', saveMulti);\n    el.querySelector('[data-act=\"clear\"]')?.addEventListener('click', () => { closeEditor(); commit(grid, r, c, undefined, 0); });\n    q.addEventListener('keydown', (e) => {\n      e.stopPropagation();\n      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }\n      else if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(hl + 1, filtered.length - 1); render(); }\n      else if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(hl - 1, 0); render(); }\n      else if (e.key === ' ' && multi && filtered[hl]) { e.preventDefault(); choose(filtered[hl]); }\n      else if (e.key === 'Enter' || e.key === 'Tab') {\n        e.preventDefault();\n        if (multi) saveMulti();\n        else if (!options.length && lookup) manual();\n        else if (filtered[hl]) choose(filtered[hl]);\n      }\n    });\n  }\n\n  function listEditor(grid, r, c, st, td) {\n    const items = (Array.isArray(st.comp.answer) ? st.comp.answer : []).filter((x) => String(x.value) !== '0').map((x) => ({ ...x }));\n    const editable = st.comp.isEditableList !== false;\n    const el = document.createElement('div');\n    el.className = 'pop';\n    const oldList = (Array.isArray(st.target?.comp?.answer) ? st.target.comp.answer : []).filter((x) => String(x.value) !== '0');\n    el.innerHTML = '<div class=\"pop-body\"><\/div><div class=\"pop-foot\"><button class=\"btn\" data-act=\"add\">+ Tambah<\/button>'\n      + `${oldList.length ? '<button class=\"btn\" data-act=\"copy-old\">Salin isian sekarang<\/button>' : ''}<button class=\"btn primary\" data-act=\"save\">Simpan<\/button> Esc: batal<\/div>`;\n    const body = el.firstChild;\n    const render = () => {\n      body.innerHTML = items.length ? items.map((it, i) => `<div class=\"li-row\"><input data-i=\"${i}\" value=\"${esc(it.label)}\"${!editable && it.saved ? ' disabled' : ''}><button class=\"btn danger\" data-del=\"${i}\">×<\/button><\/div>`).join('') : '<div class=\"pop-note\">Belum ada isian.<\/div>';\n    };\n    items.forEach((it) => { it.saved = true; });\n    render();\n    placeBelow(el, td.getBoundingClientRect(), 300);\n    editor = { el, grid };\n    const add = () => { items.push({ value: null, label: '' }); render(); body.querySelector(`input[data-i=\"${items.length - 1}\"]`)?.focus(); };\n    if (!items.length) add();\n    else body.querySelector('input')?.focus();\n    body.addEventListener('input', (e) => { const i = e.target.dataset.i; if (i !== undefined) items[+i].label = e.target.value; });\n    body.addEventListener('click', (e) => { const d = e.target.closest('[data-del]'); if (d) { items.splice(+d.dataset.del, 1); render(); } });\n    const save = () => {\n      // nomor item baru melanjutkan lastId isian sekarang supaya tidak bentrok dengan item roster yang sudah ada\n      let last = Math.max(0, ...items.map((it) => Number(it.value) || 0), ...oldList.map((it) => Number(it.value) || 0));\n      for (const src of [st.comp.answer, st.target?.comp?.answer]) {\n        const prev = (Array.isArray(src) ? src : []).find((x) => String(x.value) === '0');\n        last = Math.max(last, Number(String(prev?.label || '').split('#')[1]) || 0);\n      }\n      const out = [];\n      for (const it of items) {\n        const label = cleanText(it.label);\n        if (!label) continue;\n        const value = it.value === null ? ++last : it.value;\n        out.push({ value, label: st.comp.isCapital ? label.toUpperCase() : label });\n      }\n      closeEditor();\n      commit(grid, r, c, [{ value: '0', label: `lastId#${last}` }, ...out], 'down');\n    };\n    el.querySelector('[data-act=\"add\"]').addEventListener('click', add);\n    el.querySelector('[data-act=\"copy-old\"]')?.addEventListener('click', () => {\n      items.splice(0, items.length, ...oldList.map((x) => ({ ...x, saved: false })));\n      render();\n    });\n    el.querySelector('[data-act=\"save\"]').addEventListener('click', save);\n    el.addEventListener('keydown', (e) => {\n      e.stopPropagation();\n      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }\n      else if (e.key === 'Enter' && cess: env.success, message: env.message, data, errorCode: env.errorCode };\n  }\n  const safeName = (s) => String(s).replace(/[^\\w.-]+/g, '_');\n  function exportJson() {\n    if (!state.rows.length) return toast('Belum ada baris untuk diekspor.');\n    activeDialog?.close();\n    // ringkasan dihitung dari HASIL update (data asli + perubahan), yaitu data yang akan diekspor\n    setLoading('Menghitung hasil update…');\n    const evs = state.rows.map((row) => evalRow(resultOf(row) || row.engine, '', MAIN_COLS, false));\n    let updRows = 0;\n    let updTotal = 0;\n    let rmTotal = 0;\n    let ignoredTotal = 0;\n    for (const row of state.rows) {\n      const res = resultOf(row);\n      if (!res) continue;\n      updRows++;\n      updTotal += row.updates.size;\n      rmTotal += row.remarks.size;\n      for (const k of [...row.updates.keys(), ...row.remarks.keys()]) {\n        const c = res.getComponent(k);\n        if (!c || c.enable === false || !ancestorsEnabled(res, k)) ignoredTotal++;\n      }\n    }\n    setLoading(null);\n    const galats = state.rows.map((row) => galatOf(resultOf(row) || row.engine, ignoreOf(row)));\n    const errRows = galats.map((g, i) => (g ? i + 1 : 0)).filter(Boolean);\n    const incRows = evs.map((ev, i) => (!galats[i] && !ev.complete ? i + 1 : 0)).filter(Boolean);\n    const ar = Math.min(mainGrid.active.r, state.rows.length - 1);\n    const list = (a) => (a.length > 12 ? `${a.slice(0, 12).join(', ')}, …` : a.join(', '));\n    const modal = document.createElement('div');\n    modal.className = 'modal dlg-wrap';\n    modal.innerHTML = `<div class=\"dlg\">\n      <div class=\"modal-head\"><div class=\"mt\"><b>Export JSON (format FASIH)<\/b><span>sama dengan respons get-by-assignment-id: {success, message, data:{…, data, pre_defined_data, comment}, errorCode}<\/span><\/div><button class=\"btn\" data-act=\"close\">Tutup (Esc)<\/button><\/div>\n      <div class=\"dlg-body\">\n        <div>Perubahan di kolom UPDATE DATA <b>baru dieksekusi d n  }\n  const SUBMIT_KEY = 'fasih_sheet_submit_settings';\n  function submitSummary(res, dry) {\n    const ch = res.changes || [];\n    const n = (j) => ch.filter((x) => x.jenis === j).length;\n    const parts = [];\n    if (ch.length) parts.push(`${ch.length} jawaban (${n('baru')} baru, ${n('ubah')} diubah, ${n('hapus')} dihapus)`);\n    if (res.commentChanged) parts.push(`catatan ${res.remarks?.sebelum ?? '?'} → ${res.remarks?.sesudah ?? '?'}`);\n    const what = parts.join(' · ') || 'tidak ada perubahan';\n    return dry ? `${what} · versi server ${res.version}` : `${what} · versi ${res.version} → ${res.versionAfter}`;\n  }\n  // ---- tunggu assignment_id yang masih antri / dimuat sebelum kirim ke FASIH\n  let pasteBusy = 0; // tempel yang masih menunggu data dimuat (nilai Baru/Remark diterapkan sesudahnya)\n  const loadingRows = () => state.rows.filter((r) => r.loading || r.queued);\n  const isBusy = () => pasteBusy > 0 || loadingRows().length > 0;\n  let waitingSubmit = null;\n  /** Dialog \"menunggu\" sampai semua assignment selesai dimuat. Resolve true bila selesai, false bila dibatalkan. */\n  function waitUntilLoaded(label) {\n    if (waitingSubmit) return waitingSubmit.promise;\n    activeDialog?.close();\n    const modal = document.createElement('div');\n    modal.className = 'modal dlg-wrap';\n    modal.innerHTML = `<div class=\"dlg\">\n      <div class=\"modal-head\"><div class=\"mt\"><b>${esc(label)}<\/b><span>menunggu assignment_id selesai dimuat dari FASIH<\/span><\/div><button class=\"btn\" data-act=\"close\">Batal (Esc)<\/button><\/div>\n      <div class=\"dlg-body\"><div class=\"dlg-sum wait-msg\"><\/div><div class=\"dlg-count\">Pengiriman dimulai otomatis setelah semua baris selesai dimuat (jeda muat ${esc(state.loadDelay)} ms per assignment). Baris yang gagal dimuat tidak ikut dikirim.<\/div><\/div><\/div>`;\n    document.body.appendChild(modal);\n    const msg = modal.querySelector('.wait-msg');\n    let timer = null;\n    let done;\n    const      else { // baris lain dengan assignment sama: data dasar baru tanpa perubahan (No roster tetap)\n                for (const m of x.group) if (m !== x.row) initRow(m, { ...serializeRow(x.row), updates: [], remarks: [], rosterNo: m.rosterNo });\n                mainGrid.renderBody();\n                scheduleSave();\n              }\n            }\n          } catch (e) {\n            x.status = 'GAGAL';\n            x.ket = String((e && e.message) || e);\n          }\n          render();\n          // jeda antar-record (dry run & LIVE), sama seperti menu Script-based automation\n          if (x !== targets[targets.length - 1] && state.sendDelay && !stop) await new Promise((r) => setTimeout(r, state.sendDelay));\n        }\n        const n = (s) => targets.filter((x) => x.status === s).length;\n        toast(dry ? `Dry run selesai: ${n('DRY RUN')} siap dikirim, ${n('LEWATI')} tanpa perubahan, ${n('GAGAL')} gagal.`\n          : `Selesai: ${sent} terkirim, ${n('GAGAL')} gagal.`, n('GAGAL') ? 'err' : 'ok');\n      } catch (e) {\n        toast(`Gagal: ${e.message}`, 'err');\n      } finally {\n        setRunning(false);\n      }\n    }\n    $('[data-act=\"close\"]').addEventListener('click', close);\n    $('[data-act=\"dry\"]').addEventListener('click', () => run(true));\n    $('[data-act=\"live\"]').addEventListener('click', () => run(false));\n    $('[data-act=\"stop\"]').addEventListener('click', () => { stop = true; toast('Berhenti setelah baris yang sedang dikirim.'); });\n    if (mode === 'dry') run(true);\n  }\n\n  function csvValue(type, a) {\n    if (a === null || a === undefined) return '';\n    if (Array.isArray(a)) {\n      if (type === T.LISTTEXT) return a.filter((x) => String(x.value) !== '0').map((x) => x.label).join('|');\n      if (type === T.GPS) return a[0]?.value && typeof a[0].value === 'object' ? `${a[0].value.latitude},${a[0].value.longitude}` : '';\n      return a.map((o) => (o && typeof o === 'object' ? (o.value ?? o.label) : o)).join('|');\n    }\n    if (typeof a === 'object') return JSON.stringify(a);\n    return String(a);\n  }\n  function exportCsv() {\n    const q = (s) => `\"${String(s).replace(/\"/g, '\"\"')}\"`;\n    const lines = [['baris', 'assignment_id', 'status', ...MAIN_COLS.map((c) => c.key)].map(q).join(',')];\n    state.rows.forEach((row, i) => {\n      const ev = evalRow(row.engine, '', MAIN_COLS, false);\n      const g = galatOf(row.engine, ignoreOf(row));\n      const status = g ? `${g} galat` : ev.complete ? 'lengkap' : 'belum lengkap';\n      const vals = ev.states.map((st) => {\n        if (!st.comp || st.mode === 'skip' || st.mode === 'hidden') return '';\n        if (st.col.type === T.NESTED) return st.nested ? st.nested.count : '';\n        return csvValue(st.col.type, st.comp.answer);\n      });\n      lines.push([i + 1, row.meta?.assignmentId || '', status, ...vals].map(q).join(','));\n    });\n    download(`se2026-sheet-${stamp()}.csv`, `﻿${lines.join('\\r\\n')}`, 'text/csv;charset=utf-8');\n  }\n  // ------------------------------------------------------------------ impor (file, tempel, FASIH)\n  const parseMaybe = (s) => {\n    if (s === null || s === undefined || s === '') return null;\n    if (typeof s === 'object') return s;\n    try { return JSON.parse(s); } catch (e) { return null; }\n  };\n  /** JSON.parse yang toleran: teks berisi beberapa objek JSON / sisa teks lain di belakangnya. */\n  function parseJsonLoose(text) {\n    try { return [JSON.parse(text)]; } catch (e) { /* lanjut pindai */ }\n    const out = [];\n    let depth = 0;\n    let start = -1;\n    let inStr = false;\n    for (let i = 0; i < text.length; i++) {\n      const ch = text[i];\n      if (inStr) {\n        if (ch === '\\\\') i++;\n        else if (ch === '\"') inStr = false;\n        continue;\n      }\n      if (ch === '\"') { if (depth > 0) inStr = true; continue; }\n      if (ch === '{' || ch === '[') { if (depth === 0) start = i; depth++; }\n      else if ((ch === '}' || ch === ']') && depth .has(k));\n    if (unknown.length) throw new Error(`variabel tidak ada / tidak bisa diubah di kuesioner ini: ${unknown.join(', ')}`);\n    const scopes = new Set(keys.map(scopeOf));\n    if (scopes.size > 1) throw new Error('variabel roster tidak bisa dicampur dengan variabel utama / roster lain');\n    const row = initRow({ id: -(++headlessSeq) }, f.item);\n    const path = ROSTER_OF.get(keys[0]) || [];\n    const ros = path.length ? { path, nest: path[path.length - 1], cols: path[path.length - 1].cols || [] } : null;\n    let suffix = '';\n    if (ros) {\n      const res = resolveRoster(row.engine, ros, rosterNo, rmode);   // nomor urut / nama item -> key roster asli\n      if (res.error) throw new Error(res.error);\n      suffix = res.suffix;\n      row.rosterNo = rnoNormalize(rosterNo, ros.path.length, rmode);\n    }\n    const cols = ros ? ros.cols : MAIN_COLS;\n    const sel = new Set(keys);\n    const updCols = [];\n    cols.forEach((col, baseIndex) => {\n      if (!sel.has(col.key)) return;\n      const common = { key: col.key, type: col.type, tpl: col.tpl, target: col, baseIndex, sections: [UPD_SECTION] };\n      updCols.push({ ...common, kind: 'new', label: col.label, width: col.width });\n      if (col.tpl?.enableRemark === true) updCols.push({ ...common, kind: 'remark', label: col.label, width: 210 });\n    });\n    const base = evalRow(row.engine, suffix, cols, false);\n    // Putaran 1 memakai opsi data terload; nilai yang ditolak dicoba lagi dengan opsi dari HASIL update (data asli +\n    // nilai yang sudah masuk) — opsi dinamis bisa bergantung pada isian lain di baris yang sama (mis. kode_bang 2/3\n    // baru ada setelah keberadaan keluarga = ditemukan). Berhenti bila semua masuk atau tidak ada kemajuan.\n    const sk = (st) => `${st.col.kind}:${st.col.key}`;\n    let todo = null;\n    let ctx = null;\n    let notes = [];\n    for (let pass = 0; pass < 4; pass++) {\n      const res = pass ? resultOf(row) : null;\n      const states = updStates({ row, engine: row.engine, suffix: '' }, updCols, base.states, res ? evalRow(res, suffix, cols, false).states : null);\n      ctx = newCtx();\n      notes = [];\n      const failed = new Set();\n      for (const st of states) {\n        const text = st.col.kind === 'remark' ? remarks[st.col.key] : values[st.col.key];\n        if (text === undefined || text === null || String(text).trim() === '') continue;\n        if (todo && !todo.has(sk(st))) continue;\n        if (st.mode !== 'open') { notes.push(`${st.col.key}: tidak bisa diubah (${st.mode === 'na' ? 'tidak ada di assignment ini' : st.mode})`); continue; }\n        const n = ctx.errors.length;\n        // opsi lookup dari API lookup FASIH; kode yang tidak ada di master / master gagal dimuat -> ditolak\n        if (await withLookupOptions(st, text, ctx, () => loadOptionsFor(res || row.engine, st))) applyCellText(row, st, text, ctx);\n        if (ctx.errors.length > n) failed.add(sk(st));\n      }\n      row.updVer = (row.updVer || 0) + 1;\n      if (!failed.size || (todo && failed.size >= todo.size)) break;\n      todo = failed;\n    }\n    if (ctx.errors.length || notes.length) throw new Error([...ctx.errors, ...notes].join('; '));\n    if (!pendingCount(row)) return { none: true };\n    if (row.remarks.size) await resolveRemarkSenders([row], { strict: true });\n    const res = resultOf(row);\n    const ignored = [...row.updates.keys(), ...row.remarks.keys()]\n      .filter((k) => { const c = res.getComponent(k); return !c || c.enable === false || !ancestorsEnabled(res, k); });\n    return {\n      envelope: clone(toFasihEnvelope(row)),\n      galat: galatOf(res, new Set(ignore)),\n      ignoredGalat: ignoredGalatOf(res, new Set(ignore)),\n      errors: rowErrors(res, new Set(ignore)).slice(0, 10),\n      ignored,\n      nUpdates: row.updates.size,\n      nRemarks: row.remarks.size,\n      code: row.meta?.code || '',\n    };\n  }\n  if (HEADLESS) {\n    // tampilan tidak dipakai; nilai toggle tidak disimpan\n    state.showOld = false;\n    state.showRemark = true;\n    window.SHEET_API = Object.freeze({\n      ready: true,\n      template: { id: TEMPLATE.id || TEMPLATE.dataKey || '', version: TEMPLATE.version || '', title: TEMPLATE.title || '' },\n      compute: headlessCompute,\n    });\n  }\n\n  window.sheetApp = { state, grids, MAIN_COLS, createEngine, evalRow, commit, normalizeImport, importItems, toFasihEnvelope, applySelection, setUpdate, refreshRowAll };\n\n  (async () => {\n    let saved = null;\n    try {\n      saved = HEADLESS ? null : JSON.parse(localStorage.getItem(LS_KEY) || 'null');\n      if (!saved && TEMPLATE.dataKey === 'se2026_new') saved = JSON.parse(localStorage.getItem(LEGACY_LS_KEY) || 'null');\n    } catch (e) { saved = null; }\n    const list = saved && Array.isArray(saved.rows) ? saved.rows : [];\n    // sheet.html?assignmentId=<id>[&assignmentId=...] langsung memuat assignment tersebut dari FASIH\n    const params = new URLSearchParams(location.search);\n    const urlIds = HEADLESS ? [] : parseIds(params.getAll('assignmentId').join('\\n'));\n    state.rnoMatch = saved?.rnoMatch === 'label' ? 'label' : 'no';\n    if (Array.isArray(saved?.selected) && saved.selected.length) {\n      state.selected = sameScope(saved.selected.filter((k) => SELECTABLE.has(k)));\n      applyUpdToggles();\n      mainGrid.reselect();\n    }\n    if (list.length) {\n      await addRows(list, 'Memulihkan isian');\n      if (saved.templateVersion && saved.templateVersion !== TEMPLATE.version) toast(`Data tersimpan dibuat dengan template v${saved.templateVersion}; template sekarang v${TEMPLATE.version}.`);\n      setSaveStatus(`dipulihkan dari browser (${list.length} baris)`);\n    } else {\n      setSaveStatus('belum ada data');\n    }\n    mainGrid.setActive(0, firstToFill(mainGrid.rowEvals[0]));\n    if (urlIds.length) loadAssignments(urlIds);\n  })();\n})(SheetEngine, SheetForm);\n"}</script>
<script>
/*
 * FASIH Sheet — pemuat.
 * Halaman ini meminta file kuesioner HTML (mis. index.html form FASIH), mengambil darinya data template,
 * validasi & preset (window.__TPL, __VAL, shim window.Android), bundel engine FASIH + UI form, dan CSS UI-nya,
 * lalu merangkai dokumen sheet (UI dari sheet-src/sheet.css + sheet.js) dan menjalankannya di halaman ini.
 * Kuesioner yang pernah diimpor disimpan di IndexedDB agar bisa langsung dibuka lagi.
 */
(() => {
  'use strict';

  const ASSETS = JSON.parse(document.getElementById('sheet-assets').textContent); // { css, js }
  const LAST_KEY = 'fasih_sheet_last_questionnaire';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  // ------------------------------------------------------------------ perakit dokumen sheet
  /** Identitas kuesioner dari awal blok window.__TPL. */
  function templateMeta(src) {
    const i = src.indexOf('window.__TPL=');
    const head = i >= 0 ? src.slice(i, i + 4000) : '';
    const pick = (k) => (head.match(new RegExp(`"${k}"\\s*:\\s*"([^"]*)"`)) || [])[1] || '';
    return { id: pick('id'), title: pick('title'), dataKey: pick('dataKey'), acronym: pick('acronym'), version: pick('version') };
  }

  /**
   * Rangkai dokumen sheet dari HTML kuesioner. Melempar Error bila file bukan HTML form FASIH yang dikenali.
   * Bagian bootstrap/render form di akhir modul dibuang; UI sheet ditambahkan ke dalam modul yang sama sehingga
   * bisa memakai class engine (SheetEngine) dan fungsi FasihForm (SheetForm) dari bundel tersebut.
   */
  function buildSheetDocument(src) {
    const fail = (msg) => { throw new Error(msg); };
    const tpl = src.indexOf('window.__TPL=');
    if (tpl < 0) fail('Data template (window.__TPL) tidak ditemukan. Pastikan file adalah HTML form FASIH (mis. index.html).');
    const dStart = src.lastIndexOf('<script', tpl);
    const dEnd = src.indexOf('<\/script>', tpl);
    if (dStart < 0 || dEnd < 0) fail('Blok data template tidak lengkap.');
    const dataScript = src.slice(dStart, dEnd + '<\/script>'.length);
    if (!dataScript.includes('window.__VAL=')) fail('Data validasi (window.__VAL) tidak ditemukan.');
    if (!dataScript.includes('window.Android=')) fail('Shim window.Android (data preset/respons) tidak ditemukan.');

    const moduleOpen = '<script type="module">';
    const mStart = src.indexOf(moduleOpen, dEnd);
    if (mStart < 0) fail('Bundel engine FASIH (<script type="module">) tidak ditemukan.');
    const codeStart = mStart + moduleOpen.length;
    const cut = src.indexOf('window.FasihForm || (window.FasihForm =', codeStart);
    if (cut < 0) fail('Penanda akhir bundel (window.FasihForm) tidak ditemukan.');
    const engineCode = src.slice(codeStart, cut);
    const formFn = src.slice(cut, cut + 120).match(/window\.FasihForm \|\| \(window\.FasihForm = (\w+)\)/);
    if (!formFn) fail('Fungsi FasihForm (UI form) tidak ditemukan.');

    // class engine: deklarasi class terakhir sebelum field "graphEnablingComponent;"
    const g = engineCode.indexOf('graphEnablingComponent;');
    if (g < 0) fail('Class engine FASIH tidak ditemukan di bundel.');
    const classes = [...engineCode.slice(Math.max(0, g - 4000), g).matchAll(/class (\w+) \{/g)];
    if (!classes.length) fail('Class engine FASIH tidak ditemukan di bundel.');
    const engineClass = classes[classes.length - 1][1];

    // validasi penuh UI form (sama seperti saat Submit): store engine form + finalize yang reaktif.
    // Dipakai View supaya tanda error & menu Ringkasan menghitung galat seperti di sheet. Opsional.
    const store = engineCode.match(new RegExp(String.raw`let (\w+);\s*const \w+ = \(e\) => \{\s*\1 = \w+\(new ${engineClass}\(e\)\)`));
    const batched = store && engineCode.match(new RegExp(String.raw`(\w+)\(${store[1]}, (\w+)\(\(t\) => t\.finalize\(\)\)\)`));
    const finalizeFn = !store ? 'null'
      : batched ? `() => ${batched[1]}(${store[1]}, ${batched[2]}((t) => t.finalize()))`
        : `() => ${store[1]}.finalize()`;

    // CSS UI form (Tailwind) di <head>, dipakai tampilan View
    const headEnd = src.indexOf('</head>');
    const sStart = src.indexOf('<style>');
    const uiCss = sStart >= 0 && sStart < headEnd ? src.slice(sStart + '<style>'.length, src.indexOf('</style>', sStart)) : '';

    const meta = templateMeta(src);
    const title = `${meta.title || 'Kuesioner'} — Sheet`;
    const html = [
      '<!DOCTYPE html>',
      '<html lang="id">',
      '<head>',
      '<meta charset="utf-8" />',
      '<meta name="viewport" content="width=device-width, initial-scale=1" />',
      `<title>${esc(title)}</title>`,
      `<style id="sheet-css">\n${ASSETS.css}\n</style>`,
      // hanya aktif selama tampilan View terbuka
      `<style id="fasih-ui-css" media="not all">\n${uiCss}\n</style>`,
      dataScript,
      '</head>',
      '<body>',
      '<header class="topbar">',
      `  <div class="brand"><b id="tpl-name">${esc(meta.title || 'Kuesioner')} · Mode Sheet</b><span id="tpl-info"></span></div>`,
      '  <div class="tb-group"><button class="btn primary" id="btn-select" title="Pilih variabel yang akan diubah; muncul kolom UPDATE DATA">✎ Pilih variabel</button>'
        + '<label class="tb-check" title="Tampilkan kolom &quot;Lama&quot; (nilai sebelum diubah) di samping kolom Baru"><input type="checkbox" id="opt-old" /> Tampilkan data lama</label>'
        + '<label class="tb-check" title="Tampilkan kolom Remark untuk menambah remark baru. Remark yang sudah diisi tetap ikut dikirim/diekspor walau kolomnya disembunyikan."><input type="checkbox" id="opt-remark" /> Tampilkan remark</label></div>',
      '  <div class="tb-sep"></div>',
      '  <div class="tb-group"><button class="btn" id="btn-validate" title="Jalankan seluruh validasi pada semua baris">Validasi semua</button>'
        + '<label class="tb-check" title="Tampilkan semua kolom data kuesioner. Jika mati, hanya assignment_id, blok UPDATE DATA dan roster berisi variabel terpilih yang tampil."><input type="checkbox" id="opt-full" /> Tampilkan data lengkap</label>'
        + '<button class="btn" id="btn-next-err" title="Ke sel error berikutnya">Error berikutnya</button></div>',
      '  <div class="tb-sep"></div>',
      '  <div class="tb-group"><select class="tb-input" id="sec-jump"></select><input class="tb-input" id="col-search" placeholder="Cari kolom (label/kode) + Enter" /></div>',
      '  <div class="tb-sep"></div>',
      '  <div class="tb-group"><span class="tb-submit" id="submit-group" hidden><button class="btn dry" id="btn-submit-dry" title="Periksa perubahan yang akan dikirim ke FASIH tanpa mengirim (lib/custom_console.js)">Dry run</button><button class="btn live" id="btn-submit" title="Buka daftar perubahan yang akan dikirim ke FASIH; pengiriman LIVE dimulai dari tombol Kirim LIVE di dialog (lib/custom_console.js)">Kirim ke FASIH</button><label class="tb-check" title="Jeda antar-record saat dry run / kirim ke FASIH">Jeda kirim <input class="tb-input" id="opt-send-delay" type="number" min="0" step="500" style="width:80px" /> ms</label></span><label class="tb-check" title="Jeda antar-pemuatan assignment_id dari FASIH">Jeda muat <input class="tb-input" id="opt-load-delay" type="number" min="0" step="100" style="width:80px" /> ms</label>'
        + '<span class="tb-menu" id="export-menu"><button class="btn" id="btn-export-menu" aria-haspopup="true" aria-expanded="false">Export ▾</button><span class="tb-menu-list" hidden>'
        + '<button class="tb-menu-item" id="btn-script" title="Buat batch-automation.js dari variabel terpilih untuk di-import ke menu Script-based automation">Script <small>untuk Script-based automation</small></button>'
        + '<button class="tb-menu-item" id="btn-export" title="Data hasil update dalam format respons get-by-assignment-id">JSON <small>format FASIH</small></button>'
        + '<button class="tb-menu-item" id="btn-csv" title="Data terload sebagai tabel CSV">CSV <small>tabel data</small></button></span></span>'
        + '<button class="btn" id="btn-import">Import JSON</button><button class="btn warn" id="btn-clear">Hapus semua</button><button class="btn warn" id="btn-switch" title="Impor / pilih file kuesioner HTML lain">Ganti kuesioner</button></div>',
      '  <span class="save-status" id="save-status"></span>',
      '</header>',
      '<section class="infobar" id="infobar"></section>',
      '<main class="grid-wrap" id="grid-main" tabindex="0"></main>',
      '<footer class="legend">',
      '  <span><i class="l-new"></i>kolom update "Baru" (rencana perubahan, dieksekusi saat Export JSON)</span>',
      '  <span><i class="l-rmk"></i>kolom remark baru</span>',
      '  <span><i class="l-open"></i>data read-only (garis kuning = wajib, kosong)</span>',
      '  <span><i class="l-skip"></i>dilewati / skip</span>',
      '  <span><i class="l-ro"></i>hanya-baca</span>',
      '  <span><i class="l-err"></i>error validasi</span>',
      '  <span><i class="l-warn"></i>peringatan</span>',
      '  <span>Panah: pindah sel · Enter/ketik di kolom Baru: isi · Tab: kolom update berikutnya · Del: batalkan perubahan · <svg class="ico ico-view" viewBox="0 0 20 18" width="18" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 9s3-5.5 8.5-5.5S18.5 9 18.5 9s-3 5.5-8.5 5.5S1.5 9 1.5 9z"/><circle cx="10" cy="9" r="2.4"/></svg> lihat data terload · <svg class="ico ico-edit" viewBox="0 0 20 18" width="18" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 8s3-5.5 8-5.5S17 8 17 8M1 8s3 5.5 8 5.5"/><circle cx="9" cy="8" r="2.4"/><path class="ico-halo" d="M17 9.4l1.9 1.9-5.7 5.7-2.6.7.7-2.6z"/><path d="M17 9.4l1.9 1.9-5.7 5.7-2.6.7.7-2.6z"/></svg> lihat hasil update · Esc: tutup</span>',
      '</footer>',
      '<script type="module">',
      engineCode,
      '/* ======================= UI Sheet (sheet-src/sheet.js) ======================= */',
      `const SheetEngine = ${engineClass};`,
      `const SheetForm = ${formFn[1]};`,
      `const SheetFinalize = ${finalizeFn};`,
      ASSETS.js,
      '<\/script>',
      '</body>',
      '</html>',
      '',
    ].join('\n');
    return { html, meta };
  }

  // ------------------------------------------------------------------ penyimpanan kuesioner (IndexedDB)
  const idb = (() => {
    let opening = null;
    const open = () => opening || (opening = new Promise((resolve, reject) => {
      const req = indexedDB.open('fasih-sheet', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('questionnaires', { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
    const run = async (mode, fn) => {
      const db = await open();
      return new Promise((resolve, reject) => {
        const t = db.transaction('questionnaires', mode);
        const req = fn(t.objectStore('questionnaires'));
        t.oncomplete = () => resolve(req?.result);
        t.onerror = () => reject(t.error);
        t.onabort = () => reject(t.error);
      });
    };
    return {
      put: (v) => run('readwrite', (s) => s.put(v)),
      get: (id) => run('readonly', (s) => s.get(id)),
      all: () => run('readonly', (s) => s.getAll()),
      del: (id) => run('readwrite', (s) => s.delete(id)),
    };
  })();
  const getLast = () => { try { return localStorage.getItem(LAST_KEY); } catch (e) { return null; } };
  const setLast = (id) => { try { localStorage.setItem(LAST_KEY, id); } catch (e) { /* preferensi saja */ } };

  // ------------------------------------------------------------------ jalankan sheet
  function launch(html) {
    // ?pick=1 hanya untuk halaman pemuat; buang supaya reload tetap membuka sheet
    if (new URLSearchParams(location.search).has('pick')) history.replaceState(null, '', location.pathname);
    // ganti dokumen pemuat dengan dokumen sheet (URL tetap sama, mis. ?assignmentId=... tetap terbaca)
    document.open();
    document.write(html);
    document.close();
  }
  function showMsg(text, kind = '') {
    const el = $('ld-msg');
    el.className = `ld-msg ${kind}`;
    el.textContent = text;
  }

  async function importFile(file) {
    if (!file) return;
    showMsg(`Membaca ${file.name}…`);
    let built;
    let src;
    try {
      src = await file.text();
      built = buildSheetDocument(src);
    } catch (e) {
      showMsg(`${file.name}: ${e.message}`, 'err');
      return;
    }
    const { meta } = built;
    const id = meta.id || meta.dataKey || file.name;
    try {
      await idb.put({ id, ...meta, fileName: file.name, size: src.length, savedAt: new Date().toISOString(), html: src });
      setLast(id);
    } catch (e) {
      // tetap jalan; hanya tidak tersimpan untuk sesi berikutnya
      console.warn('Kuesioner tidak bisa disimpan di browser:', e);
      alert('Kuesioner dijalankan, tetapi tidak bisa disimpan di browser ini (IndexedDB tidak tersedia). Saat membuka lagi, impor ulang file HTML-nya.');
    }
    launch(built.html);
  }

  async function openSaved(id, { headless = false } = {}) {
    showMsg('Memuat kuesioner tersimpan…');
    try {
      const rec = await idb.get(id);
      if (!rec) { showMsg('Kuesioner tersimpan tidak ditemukan.', 'err'); return false; }
      const built = buildSheetDocument(rec.html);
      if (!headless) setLast(id);
      launch(built.html);
      return true;
    } catch (e) {
      showMsg(`Gagal memuat: ${e.message}`, 'err');
      return false;
    }
  }

  async function renderList() {
    const box = $('ld-list');
    let list = [];
    try { list = await idb.all(); } catch (e) {
      box.innerHTML = '<div class="ld-note">Penyimpanan browser (IndexedDB) tidak tersedia — kuesioner perlu diimpor setiap kali halaman dibuka.</div>';
      return;
    }
    list.sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
    if (!list.length) { box.innerHTML = '<div class="ld-note">Belum ada kuesioner tersimpan.</div>'; return; }
    const last = getLast();
    box.innerHTML = list.map((q) => `<div class="ld-item${q.id === last ? ' last' : ''}">
        <div class="ld-info"><b>${esc(q.title || q.id)}</b><span>template v${esc(q.version || '-')} · ${esc(q.fileName || '')} · ${(q.size / 1024 / 1024).toFixed(1)} MB · diimpor ${esc(new Date(q.savedAt).toLocaleString('id-ID'))}</span></div>
        <button class="ld-btn primary" data-open="${esc(q.id)}">Buka</button><button class="ld-btn" data-del="${esc(q.id)}" title="Hapus dari browser (data baris sheet tidak ikut terhapus)">Hapus</button>
      </div>`).join('');
  }

  // ------------------------------------------------------------------ halaman pemuat
  $('ld-file').addEventListener('change', (e) => importFile(e.target.files?.[0]));
  const drop = $('ld-drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    importFile(e.dataTransfer.files?.[0]);
  });
  $('ld-list').addEventListener('click', async (e) => {
    const o = e.target.closest('[data-open]');
    if (o) { if (!(await openSaved(o.dataset.open))) renderList(); return; }
    const d = e.target.closest('[data-del]');
    if (d && window.confirm('Hapus kuesioner ini dari browser? Data baris sheet tidak ikut terhapus; impor ulang file HTML-nya untuk membukanya lagi.')) {
      try { await idb.del(d.dataset.del); } catch (err) { showMsg(err.message, 'err'); }
      renderList();
    }
  });

  // mode headless (iframe tersembunyi dari lib/custom_console.js untuk script Automation hasil Export):
  // window.name = "fasih-sheet-headless:<id kuesioner>" -> buka kuesioner itu tanpa mengubah pilihan terakhir
  const headless = /^fasih-sheet-headless:(.+)$/.exec(window.name || '');
  if (headless) {
    const qid = headless[1];
    openSaved(qid, { headless: true }).then((ok) => {
      if (!ok) window.SHEET_API = { error: `Kuesioner "${qid}" belum di-import di menu Custom automation. Buka Custom automation lalu import file HTML kuesionernya.` };
    }, (e) => { window.SHEET_API = { error: String((e && e.message) || e) }; });
    window.fasihSheetLoader = { buildSheetDocument, templateMeta };
    return;
  }
  // langsung buka kuesioner terakhir, kecuali diminta memilih lewat tombol "Ganti kuesioner":
  // ?pick=1 (halaman biasa) atau penanda sessionStorage (di extension, sheet berjalan di iframe srcdoc)
  const pickFlag = (() => {
    try {
      const v = sessionStorage.getItem('fasih_sheet_pick');
      sessionStorage.removeItem('fasih_sheet_pick');
      return v === '1';
    } catch (e) { return false; }
  })();
  const pick = pickFlag || new URLSearchParams(location.search).has('pick');
  const last = getLast();
  if (!pick && last) openSaved(last).then((ok) => { if (!ok) renderList(); });
  else renderList();
  window.fasihSheetLoader = { buildSheetDocument, templateMeta };
})();

</script>
</body>
</html>
